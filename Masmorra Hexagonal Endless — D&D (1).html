function invRender(){
  const p=P[0],el=$('inv');if(!p||el.hidden)return;
  const w=p.cards.find(c=>c.w),ar=p.cards.filter(c=>!c.w),lo=3*p.lv*(p.lv-1)/2,hi=3*(p.lv+1)*p.lv/2,mv=(p.race==='Elfo'?2:0)+sum(p,'mv')+lb(p,'mv');
  const it=c=>`<div class="ir" style="border-left:3px solid ${RAR[c.z][2]}"><b style="color:${RAR[c.z][2]}">${c.n}</b><small>${RAR[c.z][0]} · ${c.w?'Arma':'Artefato'} · valor ${Math.round(score(c))}</small><small>${desc(c)}</small></div>`;
  const ST=[...AT.map(a=>[a,p.ab[a]+' ('+sgn(md(p,a))+')']),['HP',`${p.hp}/${p.max}`],['Defesa',p.def],['Ataque','+'+(amod(p)+(p.lv>>2)+sum(p,'ab')+(p.race==='Gnomo'?2:0)+lb(p,'ab'))],['Dados d20',1+sum(p,'ad')+(['Ladino','Patrulheiro'].includes(p.cls)?1:0)],['Dano bônus','+'+(amod(p)+(p.lv/3|0)+sum(p,'dm')+(p.race==='Draconato'?1:0)+lb(p,'dm'))],['Dados de dano','+'+sum(p,'dd')],['Crítico','×'+(2+sum(p,'cm'))],['Movimento','d6'+(mv?(mv>0?'+':'')+mv:'')+(sum(p,'mvd')?'+d4':'')],['PM',`${p.pm}/${p.pmx}`],['Regeneração','+'+(sum(p,'reg')+(p.cls==='Clérigo'?2:0)+lb(p,'reg'))],['Vampirismo','+'+sum(p,'vamp')],['Ídolos',sum(p,'idol')]];
  const kn=known(p),lk=lst(p).filter(s=>!kn.includes(s));
  el.innerHTML=`<b>${esc(p.n)}</b> <small>${p.race} ${p.cls}${p.cls2?'/'+p.cls2:''} · Nv ${p.lv}</small><div class="bar"><u style="width:${(p.xp-lo)/(hi-lo)*100}%"></u></div><small>XP ${p.xp}/${hi} · 🧪 ${p.pot} · ☠ ${p.kills||0} · ♛ ${p.mb||0}</small>
  <small style="display:block;margin-top:4px">${RACES[p.race]} · ${CLS[p.cls].x}</small>
  <h5>Atributos</h5><div class="sg">${ST.map(([a,b])=>`<div><span>${a}</span><b>${b}</b></div>`).join('')}</div>
  <h5>Bônus por nível (raça + classe)</h5><div class="ir"><small>${RD[p.race]}</small><small>${CD[p.cls]}</small><small><b>Agora (Nv ${p.lv}):</b> HP/nível ${HPL[p.cls]} · ${['hp','def','ab','dm','mv','pm','reg'].map(k=>[{hp:'HP',def:'Def',ab:'Atq',dm:'Dano',mv:'Mov',pm:'PM',reg:'Regen'}[k],lb(p,k)]).filter(v=>v[1]).map(v=>`${v[0]} +${v[1]}`).join(' · ')||'—'}</small></div>
  <h5>Arma</h5>${w?it(w):'<div class="ir"><b>Ataque básico</b><small>'+CLS[p.cls].x.split(' · ').pop()+'</small></div>'}
  <h5>Artefatos (${ar.length})</h5>${ar.map(it).join('')||'<small>Nenhum ainda.</small>'}
  <h5>Habilidades</h5>${Object.keys(AB).filter(z=>okw(p,AB[z][3])).map(z=>{const ok=SK[z]?p.cards.some(c=>c.sk===z):p.lv>=AB[z][1];return ok||!SK[z]?`<div class="ir" style="opacity:${ok?1:.45}"><b>${ok?'':'🔒 '}${an(p,z)}</b><small>${ok?'':'Nv '+AB[z][1]+' · '}${AB[z][2]>=99?'1x por combate':'recarga '+AB[z][2]+' turnos'}</small><small>${ABD[z]}</small></div>`:''}).join('')}
  <h5>Feitiços (D&D 5e)</h5>${kn.map(s=>`<div class="ir"><b>✨ ${SP[s].n}</b><small>${SP[s].c} PM</small><small>${SP[s].d}</small></div>`).join('')||'<small>Nenhum. Encontre Pergaminhos em baús e drafts.</small>'}${lk.map(s=>`<div class="ir" style="opacity:.45"><b>🔒 ${SP[s].n}</b><small>Nv ${SP[s].l} · ${SP[s].c} PM</small></div>`).join('')}`}
document.querySelectorAll('#tabs button').forEach(b=>b.onclick=()=>{document.querySelectorAll('#tabs button').forEach(x=>x.classList.toggle('on',x===b));$('pl').hidden=b.dataset.t!=='pl';$('inv').hidden=b.dataset.t!=='inv';invRender()});
$('pb').onclick=()=>{const p=P[0];if(p.pot&&p.hp<p.max){const h=rl(2,4)+5;p.pot--;p.hp=Math.min(p.max,p.hp+h);log(`Você bebe uma poção: +${h} HP`);panel();$('pb').disabled=true}};
// ---------- endless ----------
function respawn(){const hs=Object.values(H),e=hs.filter(h=>h.t==='emp'&&h.rev&&!h.tomb&&!P.some(p=>p.q===h.q&&p.r===h.r));
  for(let i=0;i<5&&e.length;i++){const h=e.splice(Math.random()*e.length|0,1)[0],ro=Math.random();h.t=ro<.5?'mon':ro<.7?'chest':'evt';h.D=dif(hd(h));h.rev=false;paint(h)}
  for(let i=0;i<2&&e.length&&hs.filter(h=>h.t==='mini').length<26;i++){const h=e.pop();h.t='mini';h.rev=false;paint(h);log('♛ Um Mini-boss surgiu na névoa…')}
  if(rd%5===0){const fr=hs.filter(h=>hd(h)<=4&&h.t!=='boss'&&!P.some(p=>p.q===h.q&&p.r===h.r));if(fr.length){const h=pick(fr);h.t='boss';h.rev=true;paint(h,1);log(`👑 Um BOSS surgiu na rodada ${rd}! Muito mais forte que um mini-boss.`)}}}
async function loop(){
  let i=0;for(;;){await turn(P[i%P.length]);i++;await sl(100);
    if(i%P.length===0){rd++;respawn();if(rd%6===0)log(`🔥 Rodada ${rd}: os monstros ficaram mais fortes!`);panel()}}}
</script></body></html>
